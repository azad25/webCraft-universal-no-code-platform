services:
  # Frontend - Next.js (Development)
  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - NEXT_PUBLIC_API_URL=http://192.168.0.109:8000
      - NEXT_PUBLIC_WS_URL=ws://192.168.0.109:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "rm -rf .next && npm install && npm install @radix-ui/react-radio-group && npm run dev"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - webcraft-network

  # Backend - FastAPI (Development)
  api:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://webcraft:password@postgres:5432/webcraft_db
      - DATABASE_V2_URL=postgresql://webcraft:password@postgres:5432/webcraft_v2_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET_KEY=VYZVWRaQG6i1djEDjs+C4nzpMlz2bbt1/84j3QJHRPKw=
      - SECRET_KEY=VYZVWRaQG6i1djEDjs+C4nzpMlz2bbt1/84j3QJHRPKw=
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./apps/api:/app
      - api_pip_cache:/root/.cache/pip
    command: sh -c "pip install --cache-dir /root/.cache/pip -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webcraft-network

  # PostgreSQL Database (V1 & V2)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=webcraft_db
      - POSTGRES_USER=webcraft
      - POSTGRES_PASSWORD=password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-v2-db.sql:/docker-entrypoint-initdb.d/init-v2-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcraft -d webcraft_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - webcraft-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - webcraft-network

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    restart: unless-stopped
    networks:
      - webcraft-network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - webcraft-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  webcraft-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  web_node_modules:
  api_pip_cache:
