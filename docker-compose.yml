services:
  # Frontend - Next.js (Development)
  web:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - webcraft-network

  # Backend - FastAPI (Development)
  api:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://webcraft:password@postgres:5432/webcraft_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./apps/api:/app
      - api_pip_cache:/root/.cache/pip
    command: sh -c "pip install --cache-dir /root/.cache/pip -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - webcraft-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=webcraft_db
      - POSTGRES_USER=webcraft
      - POSTGRES_PASSWORD=password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcraft -d webcraft_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - webcraft-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - webcraft-network

networks:
  webcraft-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  api_pip_cache:
