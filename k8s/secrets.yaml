apiVersion: v1
kind: Secret
metadata:
  name: webcraft-secrets
  namespace: webcraft
type: Opaque
stringData:
  # Database
  DATABASE_USER: "webcraft"
  DATABASE_PASSWORD: "your-secure-password"
  DATABASE_URL: "postgresql://webcraft:your-secure-password@postgres-service:5432/webcraft_db"
  
  # JWT
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  
  # AI Services
  OPENAI_API_KEY: "your-openai-api-key"
  GOOGLE_AI_API_KEY: "your-google-ai-api-key"
  
  # Payment (Stripe)
  STRIPE_SECRET_KEY: "sk_live_your-stripe-secret-key"
  STRIPE_WEBHOOK_SECRET: "whsec_your-webhook-secret"
  STRIPE_PRO_PRICE_ID: "price_your-pro-price-id"
  STRIPE_ENTERPRISE_PRICE_ID: "price_your-enterprise-price-id"
  
  # OAuth
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"
  
  # AWS
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_S3_BUCKET: "webcraft-assets"
  
  # Email
  SENDGRID_API_KEY: "your-sendgrid-api-key"
  
  # External Services
  CLOUDFLARE_API_TOKEN: "your-cloudflare-token"
  VERCEL_TOKEN: "your-vercel-token"
  NETLIFY_TOKEN: "your-netlify-token"