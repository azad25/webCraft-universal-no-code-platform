apiVersion: v1
kind: ConfigMap
metadata:
  name: webcraft-config
  namespace: webcraft
data:
  # Database
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "webcraft_db"
  
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  
  # API Configuration
  API_URL: "https://api.webcraft.dev"
  NEXT_PUBLIC_API_URL: "https://api.webcraft.dev"
  NEXT_PUBLIC_WS_URL: "wss://api.webcraft.dev"
  
  # Environment
  NODE_ENV: "production"
  ENVIRONMENT: "production"
  
  # Kubernetes
  K8S_NAMESPACE: "webcraft-apps"
  
  # CORS
  CORS_ORIGINS: "https://webcraft.dev,https://app.webcraft.dev"